name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go-lint-test:
    name: Go lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            core
            ai-service
          key: ${{ runner.os }}-go-${{ hashFiles('core/go.sum', 'ai-service/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run golangci-lint (core)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: core

      - name: Run golangci-lint (ai-service)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: ai-service

      - name: Run Go tests (core)
        run: cd core && go test ./...

      - name: Run Go tests (ai-service)
        run: cd ai-service && go test ./...

      - name: Build core
        run: cd core && go build -o /dev/null ./cmd/server

      - name: Build ai-service
        run: cd ai-service && go build -o /dev/null ./cmd/server

  frontend-lint-build:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci
        continue-on-error: true

      - name: Install frontend dependencies (fallback)
        if: failure()
        run: cd frontend && npm install

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Build frontend
        run: cd frontend && npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile.core
          push: false
          load: true
          tags: archbattle-core:test

      - name: Build ai-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile.ai
          push: false
          load: true
          tags: archbattle-ai:test

  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: archbattle
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/archbattle?sslmode=disable
        run: |
          cd core && go run ./cmd/server migrate
